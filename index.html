<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarjeta CRC - Kendall & Kendall</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f8; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; margin: 0; }
    
    /* Botonera de control (se oculta al imprimir) */
    .actions { margin-bottom: 25px; }
    .btn-print {
      background-color: #2563eb; color: white; border: none; padding: 12px 24px;
      font-size: 1rem; border-radius: 6px; cursor: pointer; font-weight: 600;
      transition: background 0.2s;
    }
    .btn-print:hover { background-color: #1d4ed8; }

    /* Estructura de la Tarjeta CRC (Basada en tu boceto Excalidraw) */
    .crc-card {
      width: 100%; max-width: 750px; background: white; border: 3px solid #1e293b;
      border-radius: 12px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    }
    
    .crc-header {
      border-bottom: 2px solid #1e293b; padding-bottom: 15px; margin-bottom: 20px; text-align: center;
    }
    .crc-header label { font-size: 0.85rem; text-transform: uppercase; color: #64748b; font-weight: bold; letter-spacing: 1px; display: block; margin-bottom: 4px;}
    .crc-header input {
      width: 100%; border: none; font-size: 1.8rem; font-weight: bold; text-align: center;
      color: #0f172a; outline: none; background: transparent;
    }

    .crc-body { display: flex; gap: 20px; }
    .crc-col { flex: 1; display: flex; flex-direction: column; }
    .crc-col-narrow { border-left: 2px solid #e2e8f0; padding-left: 20px; }

    .crc-col label { font-size: 1.1rem; font-weight: bold; color: #1e293b; margin-bottom: 10px; border-bottom: 2px solid #334155; display: inline-block; padding-bottom: 2px; }
    textarea {
      width: 100%; min-height: 250px; border: 1px solid #cbd5e1; border-radius: 6px;
      padding: 12px; font-size: 1rem; line-height: 1.5; resize: vertical; outline: none;
    }
    textarea:focus { border-color: #2563eb; }

    /* Configuración especial para exportar a PDF / Imprimir */
    @media print {
      body { background: white; padding: 0; margin: 0; }
      .actions { display: none !important; }
      .crc-card { border: 3px solid #000; box-shadow: none; width: 100%; border-radius: 8px; }
      .crc-col-narrow { border-left: 2px solid #000; }
      .crc-header, .crc-col label { border-color: #000; }
      textarea, input { border: none !important; resize: none; }
    }
  </style>
</head>
<body>

  <div class="actions">
    <button class="btn-print" onclick="window.print()">Guardar como PDF / Imprimir</button>
  </div>

  <div class="crc-card">
    <div class="crc-header">
      <label>Nombre de la Clase</label>
      <input type="text" placeholder="Ej. Cliente" value="Cliente">
    </div>
    <div class="crc-body">
      <div class="crc-col">
        <label>Responsabilidades</label>
        <textarea placeholder="- Guardar datos personales&#10;- Consultar historial de compras&#10;- Actualizar dirección de envío"></textarea>
      </div>
      <div class="crc-col crc-col-narrow">
        <label>Colaboradores</label>
        <textarea placeholder="- Pedido&#10;- Dirección&#10;- Factura"></textarea>
      </div>
    </div>
  </div>

</body>
</html>
